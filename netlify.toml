# Netlify configuration for the IncidentMind frontend (Vite + React SPA).
# The frontend lives in /frontend; the publish dir is relative to this base.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Vite environment variables (set in Netlify UI → Site settings → Environment variables):
#   VITE_API_URL = https://<your-deployed-backend-host>   (NO trailing slash, NO secrets)
# If unset, the app calls same-origin /api (works locally via the Vite dev proxy).
# Never put API keys in VITE_* variables — they are baked into the public JS bundle.

# Single-page application: React Router handles client-side routes
# (/, /incidents/:ref, /memory). Serve index.html for every path so
# deep links and refreshes don't 404.
#
# Order matters: Netlify matches redirects top-down, so the /assets rule
# below must stay BEFORE the /* catch-all.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

# Real files always win over redirects; this catch-all only fires for
# app routes that have no file on disk (SPA fallback).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
