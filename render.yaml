# Render Blueprint for the IncidentMind production backend.
# Deploy via Render Dashboard → New → Blueprint → point at this repository.
# The frontend on Netlify only needs VITE_API_URL=<this web service URL>.
#
# Secrets (GROQ_API_KEY) are entered in the Render dashboard — never committed.

services:
  - type: web
    name: incidentmind-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromService:
          name: incidentmind-db
          type: psql
          property: connectionString
      - key: HINDSIGHT_BASE_URL
        fromService:
          name: incidentmind-hindsight
          type: web
          property: hostport
      - key: HINDSIGHT_BANK_ID
        value: incidentmind
      - key: AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: https://monumental-khapse-b6b78e.netlify.app,http://localhost:5173
      - key: GROQ_API_KEY
        sync: false          # set in the Render dashboard after first deploy
      - key: HINDSIGHT_API_KEY
        sync: false          # only if you front Hindsight with auth

  - type: psql
    name: incidentmind-db
    plan: free
    databaseName: incidentmind
    user: incidentmind

  # Hindsight (memory) as a container-backed web service.
  # The official image EXPOSEs 8888 (API) first, then 9999 (UI); Render routes
  # to the first exposed port, so the internal URL is incidentmind-hindsight:8888.
  - type: web
    name: incidentmind-hindsight
    runtime: docker
    dockerfilePath: ./Dockerfile.hindsight
    dockerContext: .
    plan: starter
    # Persistent disk keeps the embedded Postgres (pg0) data so accumulated
    # organizational memory survives redeploys.
    disk:
      name: hindsight-data
      mountPath: /home/hindsight/.pg0
      sizeGB: 1
    envVars:
      - key: HINDSIGHT_API_LLM_PROVIDER
        value: groq
      - key: HINDSIGHT_API_LLM_API_KEY
        sync: false          # same Groq key, entered in the dashboard
