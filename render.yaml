# Render Blueprint for the IncidentMind production backend — ₹0 / free tier only.
#
# Free-tier architecture (no credit card, no paid plans, no disks):
#   incidentmind-api       free Docker web service (FastAPI + Groq agent LLM)
#   incidentmind-hindsight free Docker web service — SLIM image, no local ML models
#   incidentmind-db        free PostgreSQL, shared: app tables in `public`,
#                          Hindsight memory in its own schema
#
# Why the slim image: the full Hindsight image bundles local embedding +
# reranker models (1.5GB+ RAM) and gets OOM-killed on Render's 512MB free plan.
# The slim image externalizes models per Hindsight's docs:
#   LLM        -> Gemini free tier (a single retain call needs ~64k tokens;
#                 Groq's free tier caps at 8k TPM and cannot serve Hindsight)
#   Embeddings -> Gemini embedding API (same free AI Studio key)
#   Reranker   -> rrf (no neural model, minimal resources)
#   Database   -> same free Postgres instance, HINDSIGHT_API_DATABASE_SCHEMA=hindsight
#
# Ephemeral by design (no disk on free): organizational memory self-heals —
# backend/main.py re-retains the historical dataset into Hindsight on every
# boot, idempotently by document id.
#
# Secrets are `sync: false`: Render prompts for them during deploy and stores
# them in its dashboard — never committed to the repo.

services:
  - type: web
    name: incidentmind-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incidentmind-db
          property: connectionString
      - key: HINDSIGHT_BASE_URL
        fromService:
          name: incidentmind-hindsight
          type: web
          property: hostport
      - key: HINDSIGHT_BANK_ID
        value: incidentmind
      - key: AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: https://monumental-khapse-b6b78e.netlify.app,http://localhost:5173
      - key: GROQ_API_KEY
        sync: false        # the IncidentMind agent's LLM (chat-sized calls fit Groq free)
      - key: HINDSIGHT_API_KEY
        sync: false        # leave empty unless Hindsight is fronted by auth

  - type: web
    name: incidentmind-hindsight
    runtime: docker
    dockerfilePath: ./Dockerfile.hindsight
    dockerContext: .
    plan: free
    # The API image listens on its default port 8888; declaring PORT documents
    # the routing target for Render's port detection and fromService hostport.
    envVars:
      - key: PORT
        value: "8888"
      # Stable worker identity across restarts (recommended by Hindsight docs
      # for ephemeral containers; prevents parked-task orphans).
      - key: HINDSIGHT_API_WORKER_ID
        value: hindsight-render-free
      # ---- Database: shared free Postgres, schema-separated ----
      - key: HINDSIGHT_API_DATABASE_URL
        fromDatabase:
          name: incidentmind-db
          property: connectionString
      - key: HINDSIGHT_API_DATABASE_SCHEMA
        value: hindsight
      # Small pools: free Postgres allows 50 connections total, shared with
      # the API service's SQLAlchemy pool.
      - key: HINDSIGHT_API_DB_POOL_MIN_SIZE
        value: "2"
      - key: HINDSIGHT_API_DB_POOL_MAX_SIZE
        value: "10"
      # ---- LLM: Gemini free tier (Groq free cannot serve retains) ----
      # !!! BOTH keys below MUST be a Google AI Studio key (aistudio.google.com),
      # !!! starting with "AIza". A Groq gsk_... key here fails at startup with
      # !!! 400 API_KEY_INVALID (google.genai ClientError).
      # !!! Render KEEPS previously-entered sync:false values on blueprint sync —
      # !!! if this service ever held the Groq key, overwrite it in the dashboard.
      # HINDSIGHT_API_LLM_API_KEY is ALSO the embeddings fallback in hindsight-api-slim
      # (embeddings_gemini_api_key = EMBEDDINGS_GEMINI_API_KEY or LLM_API_KEY).
      - key: HINDSIGHT_API_LLM_PROVIDER
        value: gemini
      - key: HINDSIGHT_API_LLM_MODEL
        value: gemini-3.5-flash
      - key: HINDSIGHT_API_LLM_API_KEY
        sync: false        # Google AI Studio key (AIza...), NOT a Groq key
      # ---- Embeddings: Gemini embedding API (same free key) ----
      - key: HINDSIGHT_API_EMBEDDINGS_PROVIDER
        value: google
      - key: HINDSIGHT_API_EMBEDDINGS_GEMINI_MODEL
        value: gemini-embedding-001
      - key: HINDSIGHT_API_EMBEDDINGS_GEMINI_API_KEY
        sync: false        # same Google AI Studio key (explicit: avoids the fallback above)
      # ---- Reranker: rrf — no neural model, minimal resources ----
      - key: HINDSIGHT_API_RERANKER_PROVIDER
        value: rrf

databases:
  - name: incidentmind-db
    databaseName: incidentmind
    user: incidentmind
    plan: free
