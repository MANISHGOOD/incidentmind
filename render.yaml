# Render Blueprint for the IncidentMind production backend — ₹0 / free-tier only.
# Deploy via Render Dashboard → Blueprint → point at this repository.
# The frontend on Netlify only needs VITE_API_URL=<incidentmind-api URL>.
#
# Free-tier design notes (no credit card required for any resource):
# - api + hindsight: free web services (512MB RAM, spin down after ~15min idle)
# - db: free PostgreSQL (expires 30 days after creation — recreate or upgrade later)
# - Persistent disks are PAID-ONLY on Render, so Hindsight runs WITHOUT a disk.
#   Its embedded database is therefore ephemeral. The API compensates: on every
#   boot it auto-retains the historical incident dataset back into Hindsight
#   (idempotent by document id), so organizational memory self-heals after any
#   cold start. Resolutions created during a live session persist until the
#   next sleep cycle; re-resolve or re-run Seed memory to restore them.
#
# Secrets are `sync: false`: Render prompts for them during deploy and stores
# them in its dashboard — never committed to the repo.

services:
  - type: web
    name: incidentmind-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incidentmind-db
          property: connectionString
      - key: HINDSIGHT_BASE_URL
        fromService:
          name: incidentmind-hindsight
          type: web
          property: hostport
      - key: HINDSIGHT_BANK_ID
        value: incidentmind
      - key: AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: https://monumental-khapse-b6b78e.netlify.app,http://localhost:5173
      - key: GROQ_API_KEY
        sync: false        # enter your new key in the Render dashboard
      - key: HINDSIGHT_API_KEY
        sync: false        # leave empty unless Hindsight is fronted by auth

  - type: web
    name: incidentmind-hindsight
    runtime: docker
    dockerfilePath: ./Dockerfile.hindsight
    dockerContext: .
    plan: free
    # The official Hindsight image listens on 8888 (API) + 9999 (UI) and does
    # not read Render's PORT. Declaring PORT=8888 aligns Render's internal
    # routing and the fromService hostport with the image's fixed port.
    envVars:
      - key: PORT
        value: "8888"
      - key: HINDSIGHT_API_LLM_PROVIDER
        value: groq
      - key: HINDSIGHT_API_LLM_API_KEY
        sync: false        # same new Groq key, entered in the dashboard
    # No disk: Render disks are paid-only. Memory ephemerality is handled by
    # the API's boot-time auto-seed (see header notes).

databases:
  - name: incidentmind-db
    databaseName: incidentmind
    user: incidentmind
    plan: free
