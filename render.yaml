# Render Blueprint for the IncidentMind production backend.
# Deploy via Render Dashboard → Blueprint → point at this repository.
# The frontend on Netlify only needs VITE_API_URL=<incidentmind-api URL>.
#
# Secrets (GROQ_API_KEY) are `sync: false`: Render prompts for them during
# deploy and stores them in its dashboard — never committed to the repo.
#
# Topology: incidentmind-api (FastAPI/Docker) → incidentmind-db (Postgres)
#           incidentmind-api → incidentmind-hindsight (memory, Docker)

services:
  - type: web
    name: incidentmind-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incidentmind-db
          property: connectionString
      - key: HINDSIGHT_BASE_URL
        fromService:
          name: incidentmind-hindsight
          type: web
          property: hostport
      - key: HINDSIGHT_BANK_ID
        value: incidentmind
      - key: AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: https://monumental-khapse-b6b78e.netlify.app,http://localhost:5173
      - key: GROQ_API_KEY
        sync: false        # enter your new key in the Render dashboard
      - key: HINDSIGHT_API_KEY
        sync: false        # leave empty unless Hindsight is fronted by auth

  - type: web
    name: incidentmind-hindsight
    runtime: docker
    dockerfilePath: ./Dockerfile.hindsight
    dockerContext: .
    plan: starter          # persistent disks require a paid instance
    # The official Hindsight image listens on 8888 (API) + 9999 (UI) and does
    # not read Render's PORT. Declaring PORT=8888 aligns Render's internal
    # routing and the fromService hostport with the image's fixed port.
    envVars:
      - key: PORT
        value: "8888"
      - key: HINDSIGHT_API_LLM_PROVIDER
        value: groq
      - key: HINDSIGHT_API_LLM_API_KEY
        sync: false        # same new Groq key, entered in the dashboard
    # Persistent disk keeps the embedded Postgres (pg0) data so accumulated
    # organizational memory survives redeploys.
    disk:
      name: hindsight-data
      mountPath: /home/hindsight/.pg0
      sizeGB: 1

databases:
  - name: incidentmind-db
    databaseName: incidentmind
    user: incidentmind
    plan: free
